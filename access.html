<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access | For You & Me Escape</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fbf7f4;
        color: #262321;
        font-family: Arial, Helvetica, sans-serif;
      }

      .language-switcher {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        max-width: min(92vw, 360px);
      }

      .language-switcher button,
      .access-button {
        border: 1px solid #262321;
        border-radius: 999px;
        background: #fffdfa;
        color: #262321;
        cursor: pointer;
        font: inherit;
        transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
      }

      .language-switcher button {
        min-width: 44px;
        min-height: 36px;
        padding: 8px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      .language-switcher button:hover,
      .language-switcher button[aria-pressed="true"],
      .access-button:hover {
        background: #262321;
        color: #fffdfa;
      }

      .language-switcher button:focus-visible,
      .access-button:focus-visible,
      .passcode-input:focus-visible {
        outline: 3px solid #9d7c5f;
        outline-offset: 3px;
      }

      .language-switcher button:active,
      .access-button:active {
        transform: translateY(1px);
      }

      main {
        display: grid;
        justify-items: center;
        gap: 30px;
        width: min(88vw, 760px);
        margin: 0 auto;
        padding: 76px 0 46px;
        text-align: center;
      }

      .page-logo {
        display: block;
        width: min(48vw, 260px);
        height: auto;
      }

      .prompt {
        display: grid;
        gap: 18px;
        max-width: 660px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.16rem, 2.4vw, 1.55rem);
        line-height: 1.5;
      }

      .prompt p {
        margin: 0;
      }

      .screen-reader-text {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .passcode-form {
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      .passcode-input {
        width: 168px;
        min-height: 58px;
        border: 1px solid #262321;
        border-radius: 8px;
        background: #fffdfa;
        color: #262321;
        font: 700 1.6rem Arial, Helvetica, sans-serif;
        letter-spacing: 0.28em;
        text-align: center;
      }

      .passcode-input.is-error {
        border-color: #7d1620;
        animation: passcode-error 420ms ease;
      }

      .passcode-input::placeholder {
        color: #9d7c5f;
      }

      .error-message {
        min-height: 1.2em;
        margin: 0;
        color: #7d1620;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .access-button {
        min-width: 150px;
        min-height: 46px;
        padding: 12px 24px;
        font-size: 0.95rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .access-transition {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #fbf7f4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 420ms ease;
      }

      .access-transition.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .transition-text {
        width: 0;
        margin: 0;
        overflow: hidden;
        border-right: 2px solid #262321;
        color: #262321;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.7rem, 7vw, 4rem);
        font-weight: 700;
        letter-spacing: 0;
        text-align: center;
        white-space: nowrap;
      }

      .access-transition.is-visible .transition-text {
        animation: type-in 1.5s steps(var(--text-characters), end) forwards, cursor-blink 650ms step-end infinite;
      }

      @keyframes passcode-error {
        0%,
        100% {
          transform: translateX(0);
        }

        20% {
          transform: translateX(-10px);
        }

        40% {
          transform: translateX(10px);
        }

        60% {
          transform: translateX(-6px);
        }

        80% {
          transform: translateX(6px);
        }
      }

      @keyframes type-in {
        from {
          width: 0;
        }

        to {
          width: var(--text-width);
        }
      }

      @keyframes cursor-blink {
        50% {
          border-color: transparent;
        }
      }

      @media (max-width: 520px) {
        .language-switcher {
          top: 10px;
          right: 10px;
          gap: 5px;
        }

        .language-switcher button {
          min-width: 39px;
          min-height: 34px;
          padding: 7px 8px;
          font-size: 0.72rem;
        }

        main {
          gap: 24px;
          padding-top: 96px;
        }

        .page-logo {
          width: min(62vw, 230px);
        }

        .prompt {
          font-size: 1.08rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="language-switcher" aria-label="Language">
      <button type="button" data-language="en" aria-pressed="true">EN</button>
      <button type="button" data-language="es" aria-pressed="false">ES</button>
      <button type="button" data-language="fr" aria-pressed="false">FR</button>
      <button type="button" data-language="nl" aria-pressed="false">NL</button>
      <button type="button" data-language="it" aria-pressed="false">IT</button>
    </nav>

    <main>
      <img class="page-logo" src="Logo.jpg" alt="For You & Me Escape" data-i18n-attr="alt:logoAlt">

      <section class="prompt" aria-live="polite">
        <p data-i18n="promptOne">Some stories are hidden inside cities</p>
        <p data-i18n="promptTwo">In your destination, there is a path made of clues, each one leading closer to something that was always meant to be found.</p>
        <p data-i18n="promptThree">Start where all secrets begin: curiosity.</p>
        <p data-i18n="promptFour">To begin, enter your passcode and authenticate access</p>
      </section>

      <form class="passcode-form">
        <label class="screen-reader-text" for="passcode" data-i18n="passcodeLabel">Passcode</label>
        <input
          class="passcode-input"
          id="passcode"
          name="passcode"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{4}"
          maxlength="4"
          placeholder="0000"
          data-i18n-attr="aria-label:passcodeLabel"
          aria-label="Passcode"
        >
        <p class="error-message" aria-live="polite"></p>
        <button class="access-button" type="submit" data-i18n="authenticate">Authenticate</button>
      </form>
    </main>

    <div class="access-transition" aria-live="polite" aria-hidden="true">
      <p class="transition-text" data-i18n="accessGranted">Access Granted</p>
    </div>

    <script>
      const translations = {
        en: {
          logoAlt: "For You & Me Escape",
          promptOne: "Some stories are hidden inside cities",
          promptTwo: "In your destination, there is a path made of clues, each one leading closer to something that was always meant to be found.",
          promptThree: "Start where all secrets begin: curiosity.",
          promptFour: "To begin, enter your passcode and authenticate access",
          passcodeLabel: "Passcode",
          errorMessage: "Incorrect passcode",
          accessGranted: "Access Granted",
          authenticate: "Authenticate"
        },
        es: {
          logoAlt: "For You & Me Escape",
          promptOne: "Algunas historias se esconden dentro de las ciudades",
          promptTwo: "En tu destino, hay un camino hecho de pistas, cada una acercandote a algo que siempre estuvo destinado a ser encontrado.",
          promptThree: "Empieza donde comienzan todos los secretos: la curiosidad.",
          promptFour: "Para comenzar, introduce tu codigo de acceso y autentica el acceso",
          passcodeLabel: "Codigo de acceso",
          errorMessage: "Codigo incorrecto",
          accessGranted: "Acceso concedido",
          authenticate: "Autenticar"
        },
        fr: {
          logoAlt: "For You & Me Escape",
          promptOne: "Certaines histoires sont cachees dans les villes",
          promptTwo: "Dans ta destination, il existe un chemin fait d'indices, chacun te rapprochant de quelque chose qui etait depuis toujours destine a etre trouve.",
          promptThree: "Commence la ou tous les secrets commencent : la curiosite.",
          promptFour: "Pour commencer, saisis ton code d'acces et authentifie l'acces",
          passcodeLabel: "Code d'acces",
          errorMessage: "Code incorrect",
          accessGranted: "Acces accorde",
          authenticate: "Authentifier"
        },
        nl: {
          logoAlt: "For You & Me Escape",
          promptOne: "Sommige verhalen liggen verborgen in steden",
          promptTwo: "Op je bestemming is er een pad van aanwijzingen, elk een stap dichter bij iets dat altijd bedoeld was om gevonden te worden.",
          promptThree: "Begin waar alle geheimen beginnen: nieuwsgierigheid.",
          promptFour: "Voer je toegangscode in en authenticeer de toegang om te beginnen",
          passcodeLabel: "Toegangscode",
          errorMessage: "Onjuiste code",
          accessGranted: "Toegang verleend",
          authenticate: "Authenticeren"
        },
        it: {
          logoAlt: "For You & Me Escape",
          promptOne: "Alcune storie sono nascoste dentro le citta",
          promptTwo: "Nella tua destinazione c'e un percorso fatto di indizi, ognuno dei quali ti avvicina a qualcosa che era sempre destinato a essere trovato.",
          promptThree: "Inizia dove cominciano tutti i segreti: la curiosita.",
          promptFour: "Per iniziare, inserisci il tuo codice di accesso e autentica l'accesso",
          passcodeLabel: "Codice di accesso",
          errorMessage: "Codice non corretto",
          accessGranted: "Accesso concesso",
          authenticate: "Autentica"
        }
      };

      const languageNames = {
        en: "English",
        es: "Spanish",
        fr: "French",
        nl: "Dutch",
        it: "Italian"
      };

      const languageButtons = document.querySelectorAll("[data-language]");
      const passcodeInput = document.querySelector(".passcode-input");
      const errorMessage = document.querySelector(".error-message");
      const accessTransition = document.querySelector(".access-transition");
      const transitionText = document.querySelector(".transition-text");
      const validPasscode = "2402";
      let transitionTimer;
      let selectedLanguage = localStorage.getItem("siteLanguage") || "en";

      function resetAccessTransition() {
        window.clearTimeout(transitionTimer);
        accessTransition.classList.remove("is-visible");
        accessTransition.setAttribute("aria-hidden", "true");
        transitionText.style.removeProperty("--text-characters");
        transitionText.style.removeProperty("--text-width");
        passcodeInput.value = "";
        passcodeInput.classList.remove("is-error");
        errorMessage.textContent = "";
      }

      function setLanguage(language) {
        const copy = translations[language] || translations.en;

        selectedLanguage = language;
        document.documentElement.lang = language;
        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent = copy[element.dataset.i18n];
        });
        document.querySelectorAll("[data-i18n-attr]").forEach((element) => {
          element.dataset.i18nAttr.split(",").forEach((entry) => {
            const [attribute, key] = entry.split(":").map((part) => part.trim());
            element.setAttribute(attribute, copy[key]);
          });
        });
        languageButtons.forEach((button) => {
          const isActive = button.dataset.language === language;
          button.setAttribute("aria-pressed", String(isActive));
          button.setAttribute("aria-label", languageNames[button.dataset.language]);
        });
        if (errorMessage.textContent) {
          errorMessage.textContent = copy.errorMessage;
        }
        localStorage.setItem("siteLanguage", language);
      }

      passcodeInput.addEventListener("input", (event) => {
        event.target.value = event.target.value.replace(/\D/g, "").slice(0, 4);
        event.target.classList.remove("is-error");
        errorMessage.textContent = "";
      });

      document.querySelector(".passcode-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (passcodeInput.value === validPasscode) {
          sessionStorage.setItem("accessConfirmed", "true");
          const grantedText = translations[selectedLanguage].accessGranted;
          transitionText.textContent = grantedText;
          transitionText.style.setProperty("--text-characters", grantedText.length);
          transitionText.style.setProperty("--text-width", `${grantedText.length}ch`);
          accessTransition.setAttribute("aria-hidden", "false");
          accessTransition.classList.add("is-visible");
          transitionTimer = window.setTimeout(() => {
            window.location.href = "welcome.html";
          }, 2300);
          return;
        }

        passcodeInput.classList.remove("is-error");
        void passcodeInput.offsetWidth;
        passcodeInput.classList.add("is-error");
        errorMessage.textContent = translations[selectedLanguage].errorMessage;
        passcodeInput.select();
      });

      languageButtons.forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.language));
      });

      window.addEventListener("pageshow", () => {
        resetAccessTransition();
      });

      setLanguage(selectedLanguage);
    </script>
  </body>
</html>
