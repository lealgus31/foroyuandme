<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | For You & Me Escape</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.7), transparent 50%),
          linear-gradient(180deg, #fcf7ef 0%, #f4ead6 100%);
        color: #2d231a;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(92vw, 760px);
        margin: 0 auto;
        padding: 32px 0 48px;
        display: grid;
        gap: 18px;
      }
      .card {
        background: rgba(255, 253, 250, 0.92);
        border: 1px solid rgba(45, 35, 26, 0.18);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 10px 28px rgba(61, 42, 22, 0.08);
      }
      h1, h2, p { margin: 0; }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 6vw, 3.5rem);
      }
      h2 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.2rem, 3vw, 1.6rem);
      }
      .muted {
        color: #6f5b49;
        line-height: 1.45;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .field {
        display: grid;
        gap: 8px;
      }
      label {
        font-size: 0.95rem;
        font-weight: 700;
      }
      input, button, select {
        font: inherit;
      }
      input {
        width: 100%;
        border: 1px solid rgba(45, 35, 26, 0.24);
        border-radius: 14px;
        padding: 14px 16px;
        background: #fffdfa;
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      button {
        border: 1px solid #2d231a;
        background: #2d231a;
        color: #fffdfa;
        border-radius: 999px;
        padding: 12px 18px;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #2d231a;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #fffdfa;
        border: 1px solid rgba(45, 35, 26, 0.18);
        border-radius: 18px;
        padding: 16px;
      }
      .status {
        font-size: 0.95rem;
      }
      .stage-grid {
        display: grid;
        gap: 10px;
      }
      .stage-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(45, 35, 26, 0.08);
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card grid">
        <h1>Admin</h1>
        <p class="muted">
          Use this page to unlock stages manually if needed. The backend URL must be set in <code>app-config.js</code>.
        </p>
        <div class="field">
          <label for="admin-token">Admin token</label>
          <input id="admin-token" type="password" autocomplete="off" placeholder="Paste the secret token here">
        </div>
        <div class="button-row">
          <button type="button" data-refresh>Refresh status</button>
          <button type="button" class="secondary" data-clear-cache>Clear cached state</button>
        </div>
        <div class="status" data-backend-status></div>
      </section>

      <section class="card grid">
        <h2>Stage controls</h2>
        <div class="stage-grid" data-stage-list></div>
      </section>

      <section class="card grid">
        <h2>Current state</h2>
        <pre data-state-output>Loading…</pre>
      </section>
    </main>

    <script src="app-config.js"></script>
    <script src="game-state.js"></script>
    <script>
      const stageList = document.querySelector("[data-stage-list]");
      const stateOutput = document.querySelector("[data-state-output]");
      const backendStatus = document.querySelector("[data-backend-status]");
      const adminTokenInput = document.querySelector("#admin-token");
      const refreshButton = document.querySelector("[data-refresh]");
      const clearCacheButton = document.querySelector("[data-clear-cache]");

      const stages = [
        { id: "sehh", label: "Unlock Riddle 1" },
        { id: "ukq", label: "Unlock Riddle 2" },
        { id: "iwnnu", label: "Unlock Riddle 3" },
        { id: "ia", label: "Unlock Riddle 4" }
      ];

      function renderStatus(state) {
        const backendReady = Boolean(window.FYME_REMOTE && window.FYME_REMOTE.enabled);
        backendStatus.textContent = backendReady
          ? `Backend configured: ${window.FYME_REMOTE.apiBaseUrl}`
          : "Backend not configured yet. Set apiBaseUrl in app-config.js first.";

        stateOutput.textContent = JSON.stringify(state || window.FYME_REMOTE?.getCachedState() || {}, null, 2);
      }

      function renderStages(state) {
        const solved = state?.solvedStages || {};
        const available = state?.availableStages || {};
        stageList.innerHTML = stages.map((stage) => `
          <div class="card" style="padding: 14px 16px; margin: 0; box-shadow: none;">
            <div class="stage-grid">
              <div class="pill">${stage.label}</div>
              <div class="muted">Available: ${available[stage.id] ? "Yes" : "No"} · Solved: ${solved[stage.id] ? "Yes" : "No"}</div>
              <div class="stage-actions">
                <button type="button" data-unlock="${stage.id}">Unlock</button>
              </div>
            </div>
          </div>
        `).join("");

        stageList.querySelectorAll("[data-unlock]").forEach((button) => {
          button.addEventListener("click", async () => {
            const token = adminTokenInput.value.trim();
            if (!token) {
              alert("Paste the admin token first.");
              return;
            }

            button.disabled = true;
            button.textContent = "Unlocking…";
            try {
              const nextState = await window.FYME_REMOTE.unlockStage(button.dataset.unlock, token);
              renderState(nextState);
            } catch (error) {
              alert(error.message || "Unlock failed.");
            } finally {
              button.disabled = false;
              button.textContent = "Unlock";
            }
          });
        });
      }

      function renderState(state) {
        renderStatus(state);
        renderStages(state);
      }

      async function refreshState() {
        if (!window.FYME_REMOTE?.enabled) {
          renderState(window.FYME_REMOTE?.getCachedState() || null);
          return;
        }

        try {
          const state = await window.FYME_REMOTE.fetchState();
          renderState(state);
        } catch (error) {
          renderState(window.FYME_REMOTE.getCachedState() || null);
          backendStatus.textContent = `Backend error: ${error.message || error}`;
        }
      }

      refreshButton.addEventListener("click", refreshState);
      clearCacheButton.addEventListener("click", () => {
        window.localStorage.removeItem("forYouAndMeEscape.remoteStateCache");
        refreshState();
      });

      refreshState();
    </script>
  </body>
</html>
